<system>
  log_level info
</system>

<source>
  @type tail
  @id tail_kubernetes_container_logs
  path /var/log/containers/*.log
  exclude_path ["/var/log/containers/fluentd-*_monitoring_*.log", "/var/log/containers/otel-collector-*_observability_*.log"]
  pos_file /var/lib/fluentd/containers.pos
  tag kubernetes.*
  read_from_head false
  refresh_interval 5
  rotate_wait 5
  <parse>
    @type cri
  </parse>
</source>

<filter kubernetes.**>
  @type kubernetes_metadata
  @id kubernetes_metadata
</filter>

<filter kubernetes.**>
  @type record_transformer
  <record>
    cluster_name k8s-observability-poc
  </record>
</filter>

<match kubernetes.**>
  @type copy

  # Existing Splunk connection
  <store>
    @type http
    @id splunk_hec_output
    endpoint https://192.168.1.15:8088/services/collector/raw?channel=a6d3b1c2-4e5f-4a7b-8c9d-0e1f2a3b4c5d&index=main&sourcetype=_json&source=kubernetes
    http_method post
    content_type text/plain
    headers {"Authorization":"Splunk #{ENV['SPLUNK_HEC_TOKEN']}"}
    tls_verify_mode none
    <format>
      @type json
    </format>
    <buffer>
      @type file
      path /var/lib/fluentd/buffer/splunk
      flush_interval 5s
      retry_forever true
    </buffer>
  </store>

  # New OpenTelemetry Collector connection
  <store>
    @type forward
    @id otel_forward_output
    <server>
      host otel-collector.observability.svc.cluster.local
      port 24224
    </server>
    <buffer tag>
      @type file
      path /var/lib/fluentd/buffer/otel
      flush_interval 5s
      retry_forever true
    </buffer>
  </store>
</match>
