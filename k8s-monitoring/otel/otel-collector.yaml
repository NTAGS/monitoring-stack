apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
data:
  config.yaml: |
    receivers:
      fluentforward:
        endpoint: 0.0.0.0:24224

    exporters:
      debug:
        verbosity: detailed

    service:
      pipelines:
        logs:
          receivers: [fluentforward]
          exporters: [debug]
